name: 🛡️ ZeroDrive OTA Safety Check

on:
  pull_request:
    branches: [master]

jobs:
  zerodrive-analyze:
    name: ZeroDrive Risk Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Get PR code diff
        id: diff
        run: |
          git diff origin/main...HEAD > pr_diff.txt
          echo "Diff captured successfully"
          cat pr_diff.txt

      - name: Run ZeroDrive AI Analysis
        id: analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python zerodrive_analyze.py

      - name: Post result comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('risk_report.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Fail pipeline if HIGH risk
        run: |
          RISK=$(cat risk_level.txt)
          echo "Risk level: $RISK"
          if [ "$RISK" = "HIGH" ]; then
            echo "🔴 ZeroDrive blocked this PR - HIGH RISK detected"
            exit 1
          else
            echo "✅ ZeroDrive approved this PR - Safe to merge"
          fi