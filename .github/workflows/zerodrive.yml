# ──────────────────────────────────────────────
# ZeroDrive — Multi-Repo OTA Safety Analysis
# ──────────────────────────────────────────────
# Triggers on every PR to main/master.
# Pulls diffs from ALL repos in zerodrive.config.json,
# sends combined context to Groq AI, posts a risk
# report on the PR, and blocks merge if risk is HIGH.
# ──────────────────────────────────────────────

name: ZeroDrive OTA Safety Analysis

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  zerodrive-analyze:
    name: 🚗 ZeroDrive Safety Check
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout the repo (so we have zerodrive.config.json + script) ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install dependencies ──
      - name: Install dependencies
        run: pip install requests

      # ── 4. Run the multi-repo analyzer ──
      #
      # GH_PAT is a Personal Access Token with `repo` scope.
      # It is required to read diffs from OTHER repos in the
      # config. The default GITHUB_TOKEN only has access to
      # the current repository.
      #
      # To create one:
      #   GitHub → Settings → Developer settings →
      #   Personal access tokens → Tokens (classic) →
      #   Generate → scope: repo
      #
      # Then add it as a repo secret named GH_PAT.
      # ─────────────────────────────────────────
      - name: Run ZeroDrive Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python zerodrive_analyze.py